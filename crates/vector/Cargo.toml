[package]
name = "vector-find"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vector: a fast GTK4 file manager with nvim-style keys"
repository = "https://github.com/Not-Bad-Company/vector"
readme = "../../README.md"
keywords = ["file-manager", "gtk4", "neovim", "linux"]
categories = ["filesystem", "gui"]

[dependencies]
vector-core = { workspace = true, features = ["script"] }
glib.workspace = true
gio.workspace = true
gtk.workspace = true
sourceview5.workspace = true
vte4 = { workspace = true, optional = true }
async-channel.workspace = true

[features]
default = ["terminal"]
# the terminal panel (F4); needs VTE for GTK4 (Arch: vte4)
terminal = ["dep:vte4"]
