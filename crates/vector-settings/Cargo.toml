[package]
name = "vector-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "vectorOS settings: Wi-Fi, Bluetooth, sound and the rest of the system in one window"

[dependencies]
vector-core.workspace = true
glib.workspace = true
gio = { workspace = true, features = ["v2_80"] }
gtk.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
