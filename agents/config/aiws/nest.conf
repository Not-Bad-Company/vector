# Nested Hyprland for AI agents (aiws nest): runs as a window on workspace 0
# with its own seat, pointer, keyboard, focus and clipboard, so agents can
# click, drag, type and copy without touching the owner's. Kept light: no
# animations, blur or shadows; nothing is drawn while nothing changes.
monitor = , preferred, auto, 1
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
}
decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}
animations { enabled = false }
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(1a1b26)
}
input {
    kb_layout = us
    follow_mouse = 1
}
cursor { no_hardware_cursors = true }
ecosystem {
    no_update_news = true
    no_donation_nag = true
}
xwayland { force_zero_scaling = true }
