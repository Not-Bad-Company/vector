# AI workspace (aiws): workspace 0 (id 10) lives on the invisible headless output
# AI, created and guarded by aiws.service. Agents work there, never on the
# owner's screen. SUPER+0 pulls it onto the focused screen to watch; leaving
# sends it back.
monitor = AI, 1920x1200@30, 0x10000, 1
workspace = 10, monitor:AI, default:true, persistent:true
unbind = SUPER, code:19
bindd = SUPER, code:19, AI workspace (watch or leave), exec, aiws show

# The nested compositor (aiws nest) keeps one fixed size, so the coordinates
# agents click at don't shift when other windows open on workspace 0
# (placed by absolute position on the AI output at 0x10000: a "center" rule
# centred it on the focused screen instead, where it could show through)
windowrule = float on, match:class aquamarine
windowrule = size 1600 1000, match:class aquamarine
windowrule = move 160 10100, match:class aquamarine
