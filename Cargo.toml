[workspace]
resolver = "3"
members = ["crates/vector-core", "crates/vector"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
glib = "0.22"
gio = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
sourceview5 = "0.11"
vte4 = "0.10"
async-channel = "2"
nucleo = "0.5"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
ignore = "0.4"
gix = { version = "0.90", default-features = false, features = ["status", "sha1"] }
tempfile = "3"
vector-core = { path = "crates/vector-core" }

[profile.release]
lto = "thin"
codegen-units = 4
