name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed gtk4 gtk4-layer-shell gtksourceview5 vte4 mpv poppler-glib libjpeg-turbo libheif xz rust gcc pkgconf git
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: VECTOR_NO_CLIPBOARD=1 cargo test --workspace --locked
